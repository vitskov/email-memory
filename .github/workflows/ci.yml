name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"
  PYTHON_VERSION: "3.14"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --locked --extra dev --python "$PYTHON_VERSION"

      - name: Run lint and typecheck gates
        env:
          PYTHON_BIN: python
          RUN_COMPILEALL: "0"
          RUN_DEPENDENCY_CHECK: "0"
          RUN_RUFF: "1"
          RUN_MYPY: "1"
          RUN_PYTEST: "0"
          REQUIRE_RUFF: "1"
          REQUIRE_MYPY: "1"
          RUFF_TARGETS: "src scripts"
          RUFF_EXTRA_ARGS: "--select E9,F"
          MYPY_TARGETS: "src"
          MYPY_EXTRA_ARGS: "--no-site-packages"
          MYPYPATH: src
        run: uv run --locked --extra dev --no-sync -- ./scripts/check_quality.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --locked --extra dev --python "$PYTHON_VERSION"

      - name: Run syntax, dependency, and test gates
        env:
          PYTHON_BIN: python
          STRICT_DEPENDENCY_CHECK: "1"
          RUN_RUFF: "0"
          RUN_MYPY: "0"
        run: uv run --locked --extra dev --no-sync -- ./scripts/check_quality.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Build and smoke-test distributions
        run: |
          uv build --no-sources --python "$PYTHON_VERSION"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          package_env="$(mktemp -d)/venv"
          UV_PROJECT_ENVIRONMENT="$package_env" \
            uv sync --locked --no-install-project --python "$PYTHON_VERSION"
          uv pip install --python "$package_env/bin/python" --no-deps "$wheel"
          uv pip check --python "$package_env/bin/python"
          "$package_env/bin/python" -c "import email_memory_store"
          "$package_env/bin/email-memory-store" --help >/dev/null
          "$package_env/bin/email-memory-store-mcp" --help >/dev/null
